services:
  db:
    image: postgres:15-alpine
    container_name: quantwarden-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantwarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantwarden_password}
      POSTGRES_DB: ${POSTGRES_DB:-quantwarden}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantwarden} -d ${POSTGRES_DB:-quantwarden}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot schema provisioning. Creates/updates all tables from
  # prisma/schema.prisma on a fresh database, then exits. The app and worker
  # wait for this to finish so they never query a database without a schema.
  db-init:
    build:
      context: ./quantwarden-ui-main
      dockerfile: Dockerfile
      target: db-init
    container_name: quantwarden-db-init
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  quantwarden-ui:
    build:
      context: ./quantwarden-ui-main
      dockerfile: Dockerfile
      target: runner
      args:
        EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
    container_name: quantwarden-ui
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${UI_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Username auth is the default. Email auth is an explicit build/deploy opt-in.
      USERNAME_AUTH_ENABLED: ${USERNAME_AUTH_ENABLED:-true}
      USERNAME_EMAIL_DOMAIN: ${USERNAME_EMAIL_DOMAIN:-guest.local}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-QuantWarden <no-reply@quantwarden.local>}
      OPENSSL_API_URL: ${OPENSSL_API_URL}
      NMAP_API_URL: ${NMAP_API_URL}
      SUBFINDER_API_URL: ${SUBFINDER_API_URL}
      SCAN_WORKER_WAKE_URL: ${SCAN_WORKER_WAKE_URL}
      SCAN_WORKER_WAKE_SECRET: ${SCAN_WORKER_WAKE_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Production HTTPS entrypoint. Enable with `--profile production`.
  # Caddy obtains and renews certificates after APP_DOMAIN points at this host.
  caddy:
    image: caddy:2-alpine
    container_name: quantwarden-caddy
    profiles: ["production"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      quantwarden-ui:
        condition: service_started
    restart: unless-stopped

  # Local SMTP catcher for demos: captures every email and shows it in a web UI
  # at http://localhost:8025 — no real mail server or credentials needed.
  # Optional local inbox. It does not enable email auth by itself.
  mailpit:
    image: axllent/mailpit:latest
    container_name: quantwarden-mailpit
    profiles: ["email-demo"]
    ports:
      - "8025:8025"
    expose:
      - "1025"
    restart: unless-stopped

  quantwarden-worker:
    build:
      context: ./quantwarden-ui-main
      dockerfile: worker/Dockerfile
    container_name: quantwarden-worker
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENSSL_API_URL: ${OPENSSL_API_URL}
      NMAP_API_URL: ${NMAP_API_URL}
      SUBFINDER_API_URL: ${SUBFINDER_API_URL}
      SCAN_WORKER_PORT: ${SCAN_WORKER_PORT}
      SCAN_WORKER_HEALTH_PORT: ${SCAN_WORKER_HEALTH_PORT}
      SCAN_WORKER_WAKE_SECRET: ${SCAN_WORKER_WAKE_SECRET}
      SCAN_WORKER_ACTIVE_EXECUTOR_TICK_MS: ${SCAN_WORKER_ACTIVE_EXECUTOR_TICK_MS}
      SCAN_WORKER_ACTIVE_SCHEDULER_TICK_MS: ${SCAN_WORKER_ACTIVE_SCHEDULER_TICK_MS}
      SCAN_WORKER_MAX_CONCURRENT_JOBS: ${SCAN_WORKER_MAX_CONCURRENT_JOBS:-6}
      SCAN_WORKER_MAX_CONCURRENT_JOBS_PER_ORG: ${SCAN_WORKER_MAX_CONCURRENT_JOBS_PER_ORG:-2}
      OPENSSL_API_TIMEOUT_SECONDS: ${OPENSSL_API_TIMEOUT_SECONDS:-3}
      OPENSSL_API_REQUEST_TIMEOUT_MS: ${OPENSSL_API_REQUEST_TIMEOUT_MS:-15000}
      OPENSSL_API_PROBE_BATCH_SIZE: ${OPENSSL_API_PROBE_BATCH_SIZE:-10}
    expose:
      - "${SCAN_WORKER_PORT:-8088}"
      - "${SCAN_WORKER_HEALTH_PORT:-8089}"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      subfinder-api:
        condition: service_started
      nmap-api:
        condition: service_started
      openssl-api:
        condition: service_started
    restart: unless-stopped

  subfinder-api:
    build:
      context: ./quantwarden-backend-main/subfinder-api
    container_name: quantwarden-subfinder-api
    init: true
    environment:
      SUBFINDER_API_ADDR: ":8085"
      FB_APP_ID: ${FB_APP_ID}
      FB_APP_SECRET: ${FB_APP_SECRET}
      VT_API_KEY: ${VT_API_KEY}
      SPYSE_API_TOKEN: ${SPYSE_API_TOKEN}
    expose:
      - "8085"
    restart: unless-stopped

  nmap-api:
    build:
      context: ./quantwarden-backend-main/nmap-api
    container_name: quantwarden-nmap-api
    init: true
    expose:
      - "8010"
    restart: unless-stopped

  openssl-api:
    build:
      context: ./quantwarden-backend-main/openssl-api
    container_name: quantwarden-openssl-api
    init: true
    expose:
      - "8020"
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
