# Image-only production override used by GitHub Actions and the Azure VM.
# The base compose file remains portable for local `docker compose up --build`.
services:
  db-init:
    image: ${IMAGE_REGISTRY}/quantwarden-db-init:${IMAGE_TAG:-latest}

  quantwarden-ui:
    image: ${IMAGE_REGISTRY}/quantwarden-ui:${IMAGE_TAG:-latest}

  quantwarden-worker:
    image: ${IMAGE_REGISTRY}/quantwarden-worker:${IMAGE_TAG:-latest}

  subfinder-api:
    image: ${IMAGE_REGISTRY}/quantwarden-subfinder-api:${IMAGE_TAG:-latest}

  nmap-api:
    image: ${IMAGE_REGISTRY}/quantwarden-nmap-api:${IMAGE_TAG:-latest}

  openssl-api:
    image: ${IMAGE_REGISTRY}/quantwarden-openssl-api:${IMAGE_TAG:-latest}
